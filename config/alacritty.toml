# ── 窗口 ──────────────────────────────────
[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
opacity = 0.85

# ── 字体 ──────────────────────────────────
[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

# ── 光标 ──────────────────────────────────
[cursor]
style = { shape = "Beam", blinking = "On" }

# ── 基础配色 ──────────────────────────────
[colors.primary]
background = "#1a1b26"        # Tokyo Night 深蓝背景
foreground = "#cdd6f4"        # Mocha 浅灰蓝文字
dim_foreground = "#7f849c"
bright_foreground = "#e6e9ff"

# 淡紫色光标
[colors.cursor]
text = "#1a1b26"
cursor = "#b4befe"

[colors.vim_mode_cursor]
text = "#1a1b26"
cursor = "#a6e3a1"

# 选中文字：蓝灰底，亮色文字
[colors.selection]
text = "#e6e9ff"
background = "#3b4261"

# 搜索结果：普通匹配用蓝色，当前匹配用奶油黄
[colors.search.matches]
foreground = "#1a1b26"
background = "#89b4fa"

[colors.search.focused_match]
foreground = "#1a1b26"
background = "#f9e2af"

# 链接提示标签
[colors.hints.start]
foreground = "#1a1b26"
background = "#f9e2af"

[colors.hints.end]
foreground = "#1a1b26"
background = "#b4befe"

# ── 标准 ANSI 调色板 ──────────────────────
[colors.normal]
black = "#32344a"
red = "#f38ba8"               # 柔和粉红
green = "#a6e3a1"             # 浅绿
yellow = "#f9e2af"            # 奶油黄
blue = "#7aa2f7"              # Tokyo Night 蓝
magenta = "#bb9af7"           # Tokyo Night 紫
cyan = "#94e2d5"              # 薄荷青
white = "#bac2de"

# ── 明亮 ANSI 调色板 ──────────────────────
[colors.bright]
black = "#737aa2"             # 灰色文字保持可读性
red = "#ff9eb5"
green = "#b5edb0"
yellow = "#ffedc2"
blue = "#89b4fa"
magenta = "#c7a9ff"
cyan = "#a6eee2"
white = "#e6e9ff"

# 部分程序使用的扩展颜色
[[colors.indexed_colors]]
index = 16
color = "#fab387"             # 桃橙

[[colors.indexed_colors]]
index = 17
color = "#f5e0dc"             # 浅玫瑰
